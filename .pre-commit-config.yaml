# betterleaks comes from the Brewfile, so the hook runs the installed binary
# instead of a copy pre-commit builds for itself. That keeps one version of the
# tool on the machine and needs no clone on a fresh checkout.
repos:
  - repo: local
    hooks:
      - id: betterleaks
        name: Detect hardcoded secrets
        entry: betterleaks git --pre-commit --redact --staged --verbose
        language: system
        pass_filenames: false
