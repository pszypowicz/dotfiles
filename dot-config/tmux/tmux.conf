set -g mouse on
set -g focus-events on
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
# Without the hyperlinks feature tmux consumes OSC 8 sequences (the right-click
# menu still offers "Copy Hyperlink") but never re-emits them to the outer
# terminal, so Ghostty has nothing to cmd+click on label-style links.
set -as terminal-features 'xterm*:hyperlinks'
set -sg escape-time 10
set -g mode-keys vi
set -g history-limit 10000

set -g default-terminal xterm-ghostty

set -s copy-command pbcopy

bind r source-file ~/.config/tmux/tmux.conf
set -g base-index 1
set -g renumber-windows on

# Step through windows with prefix + p / n. No wrap-around: stepping stops
# at the first/last window. Ghostty's Cmd+Shift+[ / ] send these prefix
# keys (see the ghostty config).
bind p if -F '#{?window_start_flag,0,1}' previous-window
bind n if -F '#{?window_end_flag,0,1}' next-window

# Trackpad gestures arrive as keys via gesture reporting (DEC 2035; the
# ghostty build emits, this tmux fork decodes - the feature negotiates
# automatically). Two-finger horizontal swipes switch windows, or walk
# the rows while a tree-family mode is open; swipe left = next, the
# content metaphor. Pinch drives the session tree: pinch out opens peek,
# pinch in commits the highlighted row - choose-tree's default template
# acts on the client that delivered the key, so no explicit switch-client
# template is needed. A pinch is continuous and arrives as one key per
# accumulated step (gesture-pinch-step in the ghostty config sets the
# granularity), so both bindings are mode-guarded to make the tail steps
# harmless: after pinch-out's first step opens the tree the rest land in
# the guard, and after pinch-in's first step commits and leaves the mode
# the rest fall through to nothing. Smart-magnify (two-finger double-tap)
# toggles between the two most recent sessions, the gesture twin of
# prefix + L. Ghostty's gesture claim swallows a reported swipe's scroll
# copy and momentum tail before it reaches the wire, so one physical
# swipe is exactly one key - no wheel recognition, no inertia.
set -g gestures on
bind -n Swipe2Left if -F '#{m/r:(tree|client|buffer|options)-mode,#{pane_mode}}' 'send-keys Down' next-window
bind -n Swipe2Right if -F '#{m/r:(tree|client|buffer|options)-mode,#{pane_mode}}' 'send-keys Up' previous-window
bind -n PinchOut if -F '#{?#{m/r:(tree|client|buffer|options)-mode,#{pane_mode}},0,1}' peek
bind -n PinchIn if -F '#{m/r:(tree|client|buffer|options)-mode,#{pane_mode}}' 'send-keys Enter'
bind -n SmartMagnify switch-client -l

# Wheel: tree-family modes (choose-tree and friends) come first - mode-tree
# swallows wheel keys that carry a real mouse event, so the wheel is
# translated to the Up/Down named keys its key switch does handle. A
# trackpad delivers a dense tick stream plus a momentum tail that would fly
# through the list, so rows step once per @wheel-divisor ticks (tune live:
# tmux set -s @wheel-divisor N). Otherwise pass through to apps that
# requested the mouse (or alt screens / other modes), else scroll-up enters
# copy-mode; 5 lines per tick inside copy-mode.
set -s @wheel-divisor 10
set -s @wheel-tick 0
bind -n WheelUpPane if -F -t = '#{m/r:(tree|client|buffer|options)-mode,#{pane_mode}}' {
  if -F '#{e|==:#{e|m:#{@wheel-tick},#{@wheel-divisor}},0}' 'send-keys -t = Up'
  set -sF @wheel-tick '#{e|+:#{@wheel-tick},1}'
} {
  if -F '#{||:#{alternate_on},#{pane_in_mode},#{mouse_any_flag}}' 'send -M' 'copy-mode -e'
}
bind -n WheelDownPane if -F -t = '#{m/r:(tree|client|buffer|options)-mode,#{pane_mode}}' {
  if -F '#{e|==:#{e|m:#{@wheel-tick},#{@wheel-divisor}},0}' 'send-keys -t = Down'
  set -sF @wheel-tick '#{e|+:#{@wheel-tick},1}'
} {
  if -F '#{||:#{alternate_on},#{pane_in_mode},#{mouse_any_flag}}' 'send -M'
}
bind -T copy-mode-vi WheelUpPane {
  select-pane
  send -X -N 5 scroll-up
}
bind -T copy-mode-vi WheelDownPane {
  select-pane
  send -X -N 5 scroll-down
}

# Fuzzy session switcher: fzf over __fzf_alt_c_source candidates, attach or
# create a session named after the picked directory's basename. fzf renders
# its own popup via --tmux from FZF_DEFAULT_OPTS, so no outer display-popup.
bind f run-shell -b "fish -c __tmux_sessionizer"

# Session tree ("peek"): choose-tree with a bell badge - a session holding a
# window with a pending bell gets an orange marker in the prefix-flash
# colours. An alias so prefix + s and the pinch-out gesture render the same
# tree; the fixed index keeps config reloads idempotent where `set -sa`
# would append a duplicate per reload.
set -s command-alias[100] peek='choose-tree -Zs -F "#{?pane_format,#{pane_current_command}#{?pane_active,*,},#{?window_format,#{window_name}#{window_flags},#{?#{m:*!*,#{session_alerts}},#[bg=colour208 fg=colour232] ! #[default] ,}#{session_windows} windows#{?session_attached, (attached),}}}"'
bind s peek

# Stash current window into a detached "bg" session (background tunnels etc).
# Creates bg on first use. Use `prefix + s` to peek, `prefix + L` to jump back.
bind S if -F '#{==:#{session_name},bg}' \
  'display "already in bg"' \
  'run "tmux has -t bg 2>/dev/null || tmux new-session -d -s bg" ; movew -t bg:'

#resize panes with ctrl + hjkl
bind -n ^k resize-pane -U 5
bind -n ^j resize-pane -D 5
bind -n ^h resize-pane -L 5
bind -n ^l resize-pane -R 5

#jump panes with hjkl
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R


set-option -g set-titles on
set-option -g set-titles-string "#S / #W"

# Status bar - terminal default colors for theme compatibility, except the
# whole bar flips orange while the prefix is pending a follow-up key.
set -g status-style "#{?client_prefix,bg=colour208 fg=colour232,bg=default fg=default}"
set -g status-left-length 14
set -g status-left " #S "
set -g window-status-current-style "bold"
set -g mode-style "bg=colour4,fg=colour15"

# Overlay surfaces (popups, menus, tree mode, window-edge fill) stay on
# terminal default colours - the tmux 3.8 themed defaults paint them grey
# regardless of the terminal theme.
set -g popup-style default
set -g popup-border-style default
set -g menu-style default
set -g menu-border-style default
set -g tree-mode-border-style default
set -g fill-character ''

# Pager integration (github.com/pszypowicz/pager): clear a page when you return
# to the window that raised it. bell.sh keys each page on #{window_id}, so the
# same id withdraws it. pane-focus-in also fires when Ghostty regains focus on
# the current window (focus-events on), clearing a page on return without a
# window switch; after-select-window covers switching to it from another window.
# run-shell -b never blocks the UI. pager resolves on the tmux server's PATH
# (started from the login shell); if it does not, the remove is a harmless no-op.
set-hook -g pane-focus-in       'run-shell -b "pager remove --key #{window_id}"'
set-hook -g after-select-window 'run-shell -b "pager remove --key #{window_id}"'
